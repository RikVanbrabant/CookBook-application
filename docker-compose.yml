version: "3.8"

services:
  # ── MailHog: simulates an SMTP server ─────────────────────────────────────
  # Open http://localhost:8025 in your browser to read emails sent by the app
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"   # SMTP — Spring sends emails here
      - "8025:8025"   # Web UI — view sent emails here

  # ── Your existing backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./back-end-project-group6-1
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      DB_PASSWORD: ""
      JWT_SECRET_KEY: dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIGp3dCB0b2tlbg==
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      APP_FRONTEND_URL: http://localhost:8080
    depends_on:
      - mailhog

  # ── Your existing frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./front-end-project-group6-1
    container_name: frontend
    ports:
      - "8080:8080"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend
