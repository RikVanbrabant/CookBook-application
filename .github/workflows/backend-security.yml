name: Backend security checks

on:
  pull_request:
    paths:
      - "back-end-project-group6-1/**"
      - ".github/workflows/backend-security.yml"
  push:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  build-test-sbom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end-project-group6-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run tests
        run: mvn -B clean verify
        env:
          DB_PASSWORD: test-password
          JWT_SECRET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      - name: Generate backend SBOM
        run: mvn -B cyclonedx:makeAggregateBom
      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: back-end-project-group6-1/target/backend-sbom.json