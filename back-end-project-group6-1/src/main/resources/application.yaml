server:
  port: 3000

spring:
  application:
    name: my-little-project
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        auto_quote_keyword: true
        format_sql: true
    open-in-view: true
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ""
  datasource:
    url: overwrite-via-applicationyaml-in-project-root
    username: overwrite-via-applicationyaml-in-project-root
    password: overwrite-via-applicationyaml-in-project-root

jwt:
  secret-key: d2ViNC1ub3Qtc28tc2VjcmV0LWFjY2Vzcy1zZWNyZXQ=

cors:
  allowed-origins:
    - http://localhost:8080
    - http://127.0.0.1:8080

logging:
  level:
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.security: DEBUG