server:
  port: 3000
spring:
  application:
    name: my-little-project
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        auto_quote_keyword: true
        format_sql: true
    open-in-view: true
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ""
  datasource:
      url: jdbc:h2:mem:testdb
      username: sa
      password: ${DB_PASSWORD}
      driver-class-name: org.h2.Driver
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
jwt:
  secret-key: ${JWT_SECRET_KEY}
app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:8080}
cors:
  allowed-origins:
    - http://localhost:8080
    - http://127.0.0.1:8080
logging:
  level:
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.security: DEBUG