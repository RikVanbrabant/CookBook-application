services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node            
      - xpack.security.enabled=false                  # Only Dev, Not in Prod
      - xpack.security.enrollment.enabled="false"     # Only Dev, Not in Prod
      - xpack.security.http.ssl.enabled="false"       # Only Dev, Not in Prod
      - xpack.security.autoconfiguration.enabled="false"
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.0
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.0.0
    container_name: filebeat
    user: root
    depends_on:
      - elasticsearch
      - kibana
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../../logs:/var/log/app_logs:ro
    command: filebeat -e --strict.perms=false

volumes:
  esdata: