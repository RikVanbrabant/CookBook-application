filebeat.inputs:
- type: filestream
  id: force-read-all-logs-v1
  enabled: true
  paths:
    - /var/log/app_logs/app.log
    - /var/log/app_logs/security.log
  parsers:
    - ndjson:
        keys_under_root: true
        add_error_key: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]

setup.kibana:
  host: "http://kibana:5601"