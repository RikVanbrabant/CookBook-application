filebeat.inputs:
- type: filestream
  id: app-logs
  enabled: true
  paths:
    - /var/log/app_logs/app.log
  parsers:
    - ndjson:
        keys_under_root: true
        add_error_key: true
  prospector.scanner.check_interval: 1s

- type: filestream
  id: security-logs
  enabled: true
  paths:
    - /var/log/app_logs/security.log
  parsers:
    - ndjson:
        keys_under_root: true
        add_error_key: true
  prospector.scanner.check_interval: 1s

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]

setup.kibana:
  host: "http://kibana:5601"